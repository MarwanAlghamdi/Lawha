# Serves the built app and reverse-proxies the API and websocket to
# lawha-server, so the browser sees a single origin. That is what keeps the
# session cookie first-party and avoids CORS entirely.
#
# ONE server block, on ONE plain-HTTP port, and nothing here terminates TLS.
#
# That is a deliberate reversal of what this file used to be, and the reason is
# that Lawha no longer owns the front door. A gateway on this network holds
# port 80, maps a name like http://lawha.local to a published port on this
# machine, and is the thing browsers actually talk to. Two TLS terminators in
# a row is not better security, it is one more place for a certificate to be
# wrong — and the gateway cannot even reach us over TLS without trusting a CA
# it has no reason to trust.
#
# WHAT THIS COST, written down because it is invisible until someone hits it.
# Browsers withhold `window.crypto.subtle` outside https and localhost, so on
# a plain-http name:
#
#   - image ids fall back from a SHA-1 of the bytes to a random id
#     (packages/excalidraw/data/blob.ts catches this itself), which means the
#     same image uploaded twice is stored twice. Uploads still work.
#   - `navigator.clipboard` is absent, so the two copy buttons fall back to
#     selecting the text for a manual Ctrl+C.
#   - a board written before ADR 0012 cannot be decrypted. Irrelevant on a
#     fresh database, which has none, and the reason this trade is affordable
#     at all.
#
# The original reason for invariant 18 — every board key minted with
# crypto.subtle — died with ADR 0012. What is left is the list above. See
# docs/adr/0018.
#
# There is no port 80 here, no 443, no canonical redirect and no
# `ssl_certificate` in this file — the TLS listener and its certificate arrive
# through the glob include below, written by docker/nginx-tls.sh when
# LAWHA_TLS is on, and it is 8443, never 443.
#
# `/lawha-ca.pem` IS served, and deliberately on this plain listener: a device
# that does not yet trust the CA cannot fetch it over a connection secured by
# that same CA. ADR 0018 deleted the location; ADR 0022 put it back, because
# gen-certs.sh had spent two ADRs printing a URL that 404s, and an instruction
# nobody can follow is how "install the CA" becomes "click through the
# warning". The location and the rest of its reasoning sit further down this
# file, immediately above `location = /healthz`.
#
# Port 80 belongs to the gateway; binding it would take the whole network's
# naming down. If you are putting TLS back, read ADR 0005 first — it is still
# correct about why, it just no longer describes this deployment.

# The scheme the BROWSER used, which is not the scheme we were reached on.
#
# The gateway in front terminates whatever the browser spoke and proxies to us
# over plain http, so `$scheme` here is always "http" and forwarding it would
# tell lawha-server the session is insecure. That header is load-bearing
# TODAY, not one day: LAWHA_SECURE_COOKIES is `auto` (ADR 0022) — the compose
# pin and the code default alike — so `req.secure`, which Express derives from
# `trust proxy` plus this forwarded scheme, is what decides whether each
# response's cookie carries `Secure`. Both failure modes are silent. Drop it
# on an https origin and the cookie goes out unflagged; report `https` on a
# plain-http origin and the browser accepts a cookie it will never send back,
# so sign-in returns 200 and the page reloads signed out, for ever.
# Prefer what the proxy set; fall back to our own scheme when nothing is in
# front.
map $http_x_forwarded_proto $lawha_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Whether a request may be written to the access log at all.
#
# A password-reset code and an invite code are BEARER CREDENTIALS carried in
# the URL PATH, and an access log is a verbatim record of request lines. So
# every one of them was being written down here, three lines per redemption,
# and kept for as long as the container's logs are kept.
#
# THE REASON THIS IS WORTH FIXING is not the threat model, which is weak:
# reading this log on this host needs root or the docker socket, while
# lawha.env — which holds LAWHA_MASTER_PASSWORD — is 0664, so anyone who can
# read the log already owns every account by an easier route, and a code is
# single-use with a one-hour life so a persisted line is dead before anyone
# gets to it. The reason is the contradiction: src/http/routes/passwordReset.ts
# sets `Cache-Control: no-store` on the preview reasoning that "nothing between
# here and the browser may keep a copy", and the reverse proxy in the same
# repository was keeping one indefinitely. /join/<code> has always had the same
# shape and is covered here for the same reason.
#
# WHY A MAP AND NOT `access_log off` IN THE MATCHING LOCATION, which is the
# obvious spelling and is a silent no-op on exactly the two paths that matter.
# /reset/<code> and /join/<code> are SPA routes: they end at `try_files …
# /index.html`, and that fallback is an INTERNAL REDIRECT, which re-runs
# location matching — so the request is logged with the configuration of
# `location /`, not of the block it first matched. Measured, not reasoned: a
# regex location with `access_log off;` three lines above the try_files logged
# the probe code anyway. `$request_uri` is the URI as it ARRIVED and the `if=`
# is evaluated at log time, so this survives the redirect by construction.
#
# ~* and not ~: a differently-cased URL carries the same credential, and losing
# the log line for /RESET/… costs nothing.
#
map $request_uri $lawha_loggable {
  default                                  1;
  # The two pages that are handed a code in their path.
  "~*^/(reset|join)/"                      0;
  # …and the API calls those pages then make with it. Covering only the pages
  # would be cosmetic: the page's very next request re-logs the code.
  "~*^/api/auth/reset/"                    0;
  # Deliberately NOT a bare /api/invites/ prefix. /api/invites/<boardId>/invites
  # is the owner's list-and-mint route, carries no code, and stays logged; only
  # the one-segment redemption shapes — /api/invites/<code> and
  # /api/invites/<code>/redeem — are silenced.
  "~*^/api/invites/[^/?]+(/redeem)?(\?|$)" 0;
}

server {
  # 8080, not 80, and not because 80 is taken inside the container — it is
  # free in here. It is so that NOTHING in this project can be published onto
  # host port 80 by a one-character edit to a compose port mapping. The
  # gateway owns 80 on this machine; a service that grabs it does not fail
  # loudly, it takes every other project's name off the network at once.
  listen 8080 default_server;

  # The optional TLS listener, and it is a glob for a reason.
  #
  # `LAWHA_TLS=on` makes docker/nginx-tls.sh write /etc/nginx/lawha/tls.conf
  # before nginx starts; unset, the directory is empty. A glob include tolerates
  # zero matches, so one file serves both states — whereas `include
  # /etc/nginx/lawha/tls.conf` on a deployment that does not want TLS is a
  # config nginx refuses to load, i.e. a stack that does not come up because a
  # feature was left OFF.
  #
  # It is INSIDE this server block, not a second block, so `listen 8443 ssl`
  # joins the listeners of the block that already defines every location. Two
  # server blocks would mean maintaining /api/, /socket.io/, the admin-backup
  # override and the SPA fallback twice, and the failure mode of forgetting one
  # is that a route works on http and 404s on https — the kind of asymmetry
  # nobody tests for.
  #
  # No Strict-Transport-Security lands there either. See the note below: the
  # certificate this stack can mint is signed by a local CA, and HSTS removes
  # the browser's "Proceed" escape hatch, so the first visitor locks themselves
  # out of the deployment they were trying to reach (ADR 0005 point 5).
  include /etc/nginx/lawha/*.conf;

  # Any name. The gateway forwards whichever the visitor typed —
  # `lawha.local`, `localhost:9002`, a bare LAN address — and all three have to
  # work, because the first is how the network reaches it, the second is how
  # the checklist verifies it on the box, and the third is what someone falls
  # back to when mDNS is being unhelpful.
  #
  # This is the "framework host allowlist" item on the deployment checklist.
  # nginx has no allowlist to update: `_` matches anything, and there is no
  # equivalent of Vite's `server.allowedHosts` or Django's `ALLOWED_HOSTS` to
  # forget. What DOES still care about the Host header is lawha-server's CSRF
  # check, and the `proxy_set_header Host $http_host` lines below are what keep
  # it honest — see the long note on /api/.
  server_name _;

  # Docker's embedded DNS, so the upstream address is resolved PER REQUEST
  # rather than once at start-up. Without this, `proxy_pass
  # http://lawha-server:3002` is resolved when the config loads and the answer
  # is cached for the life of the process — so recreating lawha-server leaves
  # nginx proxying to an address that container no longer has.
  #
  # That is not hypothetical and it is not rare: `docker compose up -d
  # --force-recreate lawha-server` is the documented way to apply an env
  # change, and `run.sh public` recreates the server without recreating
  # this container. Both left every /api/ call answering 502 while /healthz and
  # every static page kept returning 200 — a failure that looks like the server
  # crashing rather than like a stale DNS answer. Observed live: nginx held
  # 172.26.0.3 after that address had been reassigned to lawha-backup, which
  # does not listen on 3002, so the refusal was immediate and total.
  #
  # 127.0.0.11 is the resolver every container on a compose network gets. This
  # file is only ever used inside that image; a bare-nginx deployment would
  # need its own resolver line.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # Deliberately NO Strict-Transport-Security. This origin is plain http by
  # design; HSTS here would tell the browser to refuse it forever, which is a
  # deployment that cannot be visited.

  client_max_body_size 25m;

  # Same destination and same format as the http-level default this replaces —
  # `main` and that path both come from the nginx image's own nginx.conf, and
  # /var/log/nginx/access.log is a symlink to /dev/stdout, which is what puts
  # these lines in `docker logs lawha-app`. Repeated here for one reason only:
  # to hang `if=` off it. See the map above for what the condition is and why
  # it is a map rather than an `access_log off` in a location.
  #
  # Keep the FORMAT NAME in step with the base image. A name the image does not
  # define is not a degraded log, it is a config nginx refuses to load — and
  # NOTHING IN THIS REPOSITORY CATCHES THAT. This comment used to credit
  # `nginx -t` in `deploymentConfig.test.ts`; that file went with `59930dbf`,
  # and it never ran `nginx -t` in the first place — it read this file as text,
  # exactly as `scripts/deploymentConfig.test.mjs` does today. The only real
  # `nginx -t` runs were by hand (roadmap §4.20). Run one after editing this
  # block, or the first sign is a container that will not start.
  # `main` is the one that carries $http_x_forwarded_for, and behind a gateway
  # that field is the only real client address in the line.
  access_log /var/log/nginx/access.log main if=$lawha_loggable;

  # The checklist's health endpoint, and the container HEALTHCHECK's target.
  # Answers directly, on this port, with no redirect anywhere in the path —
  # busybox wget follows redirects and a health probe that follows one is
  # testing the wrong thing.
  # The CA, so a device can install the thing that makes TLS quiet.
  #
  # ADR 0018 deleted this location along with the whole TLS story, correctly at
  # the time. It comes back with ADR 0022 because `scripts/gen-certs.sh` has
  # always ended by printing "Install the CA on each device, once:
  # http://<name>/lawha-ca.pem" — and for two ADRs that URL has been a 404. An
  # instruction nobody can follow is how "install the CA" becomes "click through
  # the warning", which is the failure ADR 0018 identified as worse than no TLS.
  #
  # PUBLIC by design and by definition. A CA certificate is the half you hand
  # out; `certs/lawha-ca-key.pem` is the half that matters and is never in this
  # container at all — the mount is read-only and the key is not served by any
  # location here. `lawha-key.pem` sits in the same directory, which is exactly
  # why this is `location =` on one filename and not `location /certs/`.
  #
  # WHAT `/lawha-key.pem` RETURNS, since anyone reading this will go and check
  # and the answer looks alarming: HTTP 200. It is the SPA fallback — `try_files`
  # finds nothing under `root` and serves index.html, exactly as it does for
  # every other unknown path. Measured: `text/html`, and zero occurrences of
  # "PRIVATE KEY" in the body; same for `/lawha-ca-key.pem` and
  # `/certs/lawha-key.pem`. Only the exact-match location below reads anything
  # out of /etc/nginx/certs, and only the CA.
  #
  # Served on the plain-http listener too, deliberately: a device that does not
  # yet trust the CA cannot fetch it over a connection secured by that same CA.
  # That is not a weakening — the file is public, and a tampered CA would have
  # to be installed by hand by the person being attacked.
  location = /lawha-ca.pem {
    alias /etc/nginx/certs/lawha-ca.pem;
    default_type application/x-pem-file;
    add_header Content-Disposition 'attachment; filename="lawha-ca.pem"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    # Cross-origin readable, so a probe run from the app's OWN origin (LAN or
    # ngrok) can read a target that is a different origin from the one
    # serving the page — insider/outsider sharing needs exactly that shape.
    # Without this header a cross-origin `fetch` gets the 200 and the browser
    # still refuses to hand the body to script from another origin.
    #
    # The probe MUST be CORS mode, not `mode: "no-cors"` — a no-cors response
    # is opaque (status forced to 0) no matter what this header says, so
    # "distinguish by content" would be impossible. Measured against the live
    # tunnel, no-cors gives a response of type "opaque", status forced to 0
    # and an empty body.
    #
    #
    # **And the probe MUST be a HEAD, not a GET.** This comment previously
    # said a CORS GET to the real endpoint resolves while the same GET hitting
    # ngrok's interstitial throws, making the header above a free
    # discriminator. The second half is true; the first is NOT, and Task 7
    # caught it by driving a real Chromium at this endpoint through the live
    # tunnel. ngrok's interstitial is triggered by User-Agent sniffing, and a
    # browser cannot not-be a browser — so a GET gets the interstitial whether
    # the tunnel is up or down, both reject, and the dot reads "down" for ever.
    # A HEAD is passed through to this block untouched (measured: 200,
    # text/plain, Server: nginx, no ngrok-error-code, six for six). The client
    # then checks Content-Type, which is CORS-safelisted and so readable
    # cross-origin with nothing further exposed here.
    #
    # Wildcard, not an echoed Origin: the body below is the literal string
    # "ok\n" and nothing else, so there is nothing here for a wildcard to
    # disclose that a port scan does not already show.
    #
    # Still no Access-Control-Allow-Headers, and now for a measured reason
    # rather than an assumed one. A GET carrying `ngrok-skip-browser-warning`
    # would be the other way past the interstitial, but that header is not
    # CORS-safelisted, so it preflights — and the preflight (which DOES reach
    # this block; ngrok does not interstitial an OPTIONS either) is refused for
    # want of exactly this header. Adding it plus an OPTIONS 204 would work and
    # would also need a container restart to take effect. The HEAD needs
    # neither, so it is what ships.
    add_header Access-Control-Allow-Origin "*" always;
    # add_header does NOT merge across nesting levels — a location that
    # declares one drops every add_header inherited from the server block
    # above (see the note on the woff2 location further down, which hits the
    # same rule). Repeated here rather than left to inherit, so this response
    # keeps the same two security headers every other response on this
    # server carries.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    return 200 "ok\n";
  }

  # The backup download, which is the one response on this server that is not
  # a small JSON body.
  #
  # It has to come BEFORE `location /api/` — nginx picks the longest matching
  # prefix, so this wins for /api/admin/backup/* and /api/ still takes
  # everything else. Moving it below would not error; it would just silently
  # stop applying, which is the worst kind of config bug.
  #
  # Everything here is inherited from /api/ except the three lines that matter,
  # and they are duplicated rather than factored out because nginx `location`
  # blocks do not inherit from a sibling. Keep the proxy_set_header lines in
  # step with the block below.
  location /api/admin/backup/ {
    # Through a variable on purpose: nginx only re-resolves an
    # upstream named in a variable. A literal here is resolved once
    # at start-up, which is the stale-address bug the resolver line
    # above exists to prevent. No URI part, so the original request
    # URI is passed exactly as before.
    set $lawha_upstream lawha-server:3002;
    proxy_pass http://$lawha_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lawha_forwarded_proto;

    # Off, and this is the whole reason the block exists. With buffering on —
    # nginx's default, and what /api/ below uses — nginx reads the entire
    # upstream response before sending any of it to the client. For a JSON body
    # that is free. For a tar carrying the database and every uploaded image it
    # means writing the whole archive to nginx's temp directory first, so the
    # operator waits through a full copy before the download appears to start,
    # the box needs room for a second copy of its own backup, and anything
    # larger than proxy_max_temp_file_size (1g by default) fails outright.
    proxy_buffering off;

    # The snapshot is taken inside the request that asks for it, so the first
    # byte does not arrive until SQLite has walked the whole database. The
    # 60s default read timeout is a limit on the gap BETWEEN reads, which is
    # exactly what that pause is — a large database would be cut off mid-backup
    # and report as a network error. Five minutes is generous for the pause;
    # the transfer itself resets the clock on every chunk.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    # Through a variable on purpose: nginx only re-resolves an
    # upstream named in a variable. A literal here is resolved once
    # at start-up, which is the stale-address bug the resolver line
    # above exists to prevent. No URI part, so the original request
    # URI is passed exactly as before.
    set $lawha_upstream lawha-server:3002;
    proxy_pass http://$lawha_upstream;
    # $http_host, NOT $host. nginx's $host strips the port; $http_host is the
    # Host header exactly as it arrived, port and all.
    #
    # This one character costs a whole debugging session if it is wrong,
    # because it does not look like a proxy problem. The CSRF check in
    # lawha-server (src/http/middleware/csrf.ts) compares
    # `new URL(origin).host` against the raw Host header. A visitor reaching
    # this box on `http://localhost:9002` makes the browser send `Origin` with
    # that port in it, while $host would forward the bare name. They differ, so
    # every non-GET is refused with "Request origin not allowed" and every GET
    # keeps working. Boards open; nothing can be saved, renamed, shared or
    # deleted. That reads as a broken product, not as a missing port.
    #
    # It matters MORE behind a gateway than it did behind TLS on 443, because
    # the published port is never the default one and therefore is always in
    # the Host header.
    #
    # LAWHA_ORIGIN is the other half of the answer, and is what to set when the
    # gateway rewrites Host rather than passing it through.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # The rate limiter keys on this, and behind a gateway EVERY request arrives
    # from the gateway's address. Without this header every visitor shares one
    # rate-limit bucket and the first busy person locks out the rest. Pair it
    # with LAWHA_TRUST_PROXY_HOPS on the server side, or the server will trust
    # the header from anyone.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lawha_forwarded_proto;
  }

  location /socket.io/ {
    # Through a variable on purpose: nginx only re-resolves an
    # upstream named in a variable. A literal here is resolved once
    # at start-up, which is the stale-address bug the resolver line
    # above exists to prevent. No URI part, so the original request
    # URI is passed exactly as before.
    set $lawha_upstream lawha-server:3002;
    proxy_pass http://$lawha_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host here too, and for a second reason on top of CSRF: the relay
    # judges the handshake's `Origin` against this very header (`allowRequest`
    # in src/socket/index.ts, same rule as csrf.ts — the allowlist, or Origin's
    # host equal to Host). Forward `$host` instead and the port falls off one
    # side of that comparison but not the other, so an origin that is in fact
    # the same origin fails it.
    #
    # Note it is `allowRequest` and not socket.io's `cors` option: `cors`
    # grants a header and refuses nothing. The symptom either way is a dead
    # websocket beside a working REST API, which looks like a third unrelated
    # bug; it is this line and LAWHA_ORIGIN disagreeing.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lawha_forwarded_proto;
    # Cursor traffic is continuous but a stalled socket should still time out.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Fonts and hashed assets are immutable. The security headers are repeated
  # because add_header does not merge across levels: a location that declares
  # one drops every add_header inherited from the server block.
  location ~* \.(woff2|woff)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  # SPA fallback, so /b/<boardId> deep links resolve to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
